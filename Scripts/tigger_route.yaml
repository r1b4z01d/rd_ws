# Fetch-and-carry route: bookshelf (grab Tigger with the VLA policy) -> banana bed (place him) -> on.
#
#   cd ~/rd_ws/Scripts && python3 path.py tigger_route.yaml      # then: ros2 service call /start_waypoints std_srvs/srv/Trigger {}
#   python3 path.py --check tigger_route.yaml                     # dry parse: segments + the commands, no ROS
#
# Before starting: the arm at its home/transport pose (~/VLA/outputs/home_pose.json), the UR pendant in
# Remote Control, vla_cameras running. Nothing else is needed: each `vla:` action stops the recording
# panel if it is up, switches the inference server to its model (a ~30 s restart only when the model
# changes), runs the policy unattended, and returns the arm home before the robot drives on.
# Poses are map-frame; re-record after a new map (drive there, `ros2 topic echo /amcl_pose --once`).
waypoints:
  - name: bookshelf
    position: {x: 2.539005, y: 1.435278, z: 0.0}          # = bookshelf_1 in new_waypoints.yaml
    orientation: {x: 0.0, y: 0.0, z: 0.994799, w: 0.101862}
    post_actions:
      # The grab model. tigger_1_merged predates capture.json; it was recorded with scene/side square-cropped to
      # the MIDDLE of the frame (540x540). A backfilled capture.json (squares 0.5/0.5, 2026-10-26) travels with
      # the run, so the eval sets the cameras to that crop before the first observation.
      - vla: tigger_1_merged_smolvla_1         # training run under ~/VLA/outputs/train (run@step or a path also work)
        task: "Grab and hold tigger"           # the task string the run was trained with
        seconds: 90                            # cap on the playing phase
        done: closed                           # over when the hand has closed and stayed closed (mean curl >= 0.7
        still: 2                               #   averaged over 2 s); robust to the policy's jitter / re-grasps
        keep_grasp: true                       # carry Tigger: hand stays closed, UR stays powered for the drive
        home: true                             # tuck the arm into the transport pose before driving on
        on_fail: stop                          # a UR fault / setup failure ends the route here

  - name: banana_bed
    position: {x: 3.81765, y: 0.556675, z: 0.0}           # PLACEHOLDER (= livingroom_entrance) — record the bed pose
    orientation: {x: 0.0, y: 0.0, z: 0.997403, w: 0.072021}
    post_actions:
      - vla: tigger_bed_1_smolvla
        task: "place tigger in the banana bed"
        seconds: 90
        done: open                             # over when the hand has opened after holding (mean curl <= 0.2 over 2 s)
        still: 2

  - name: charger                              # continue the route after the drop-off
    position: {x: 6.171422, y: -7.756816, z: 0.0}
    orientation: {x: 0.0, y: 0.0, z: 0.595315, w: 0.803492}
    post_actions:
      - 'ROS_DOMAIN_ID=0 ros2 topic pub --once /battery sensor_msgs/BatteryState "{percentage: 0.82, power_supply_status: 1}"'
