; Local language model for the robot's voice assistant (rd_ws/src/robot_voice): Ollama serving
; qwen2.5:7b on :11434 to the robot subnet. RD's voice_assistant.yaml lists this box first
; (http://192.168.11.119:11434) and its own Orin second, so the voice brain survives the box being off.
;
; Ollama's installer (curl https://ollama.com/install.sh | sh) creates the `ollama` user, the model store
; /usr/share/ollama/.ollama/models and ITS OWN systemd unit, ollama.service, enabled at boot. Two managers
; would race for :11434, so `provision_gpu.sh llm` disables that unit and this program is the only owner —
; same place as vla_webui / vla_infer_server, same supervisor UI (:9999). Re-running the installer (an
; Ollama upgrade) re-enables ollama.service: run `provision_gpu.sh llm` again afterwards.
;
; OLLAMA_HOST=0.0.0.0  listen on every NIC (default is loopback only): RD reaches this box over Wi-Fi.
; OLLAMA_KEEP_ALIVE    how long a model stays in VRAM after its last request (~5 GB for qwen2.5:7b; the
;                      voice brain's warm-up asks for 24h itself, this is the default for anyone else).
; HOME                 must be set: supervisor switches the uid but keeps root's HOME, and the model store
;                      is $HOME/.ollama/models — without it the server starts with an empty library.
; stopwaitsecs         the server has to unload its llama-server child on SIGTERM before we SIGKILL it.
[program:ollama]
command=/usr/local/bin/ollama serve
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=30
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/ollama.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=2
environment=HOME="/usr/share/ollama",OLLAMA_HOST="0.0.0.0",OLLAMA_KEEP_ALIVE="1h",PATH="/usr/local/bin:/usr/bin:/bin"
user=ollama
