[program:robot_disco_collision_monitor]
command=/usr/bin/env bash -lc "source /home/rd/rd_ws/install/setup.bash && ROS_DOMAIN_ID=0 ros2 launch nav2_collision_monitor collision_monitor_node.launch.py params_file:=/home/rd/rd_ws/src/robot_disco/config/collision_monitor_params.yaml use_sim_time:=false"
directory=/home/rd/rd_ws
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/home/rd/rd_ws/log/robot_disco-collision-monitor.out.log
stderr_logfile=/home/rd/rd_ws/log/robot_disco-collision-monitor.err.log
stdout_logfile_maxbytes=20MB
stderr_logfile_maxbytes=20MB
stdout_logfile_backups=2
stderr_logfile_backups=2
environment=HOME="/home/rd",FASTRTPS_DEFAULT_PROFILES_FILE="/home/rd/rd_ws/services/fastdds_no_shm.xml"
user=rd
