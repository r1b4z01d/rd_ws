; Route editor web page (Scripts/route_editor.py): the nav2 map, the robot's live pose and a route you
; edit by clicking — saves Scripts/<name>.yaml for path.py. http://192.168.11.80:8092/
; Needs nothing but localization for the robot dot; harmless without it, so it autostarts.
[program:robot_disco_route_editor]
command=/usr/bin/env bash -lc "source /home/rd/rd_ws/install/setup.bash && ROS_DOMAIN_ID=0 python3 /home/rd/rd_ws/Scripts/route_editor.py --port 8092"
directory=/home/rd/rd_ws/Scripts
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/home/rd/rd_ws/log/robot_disco-route-editor.out.log
stderr_logfile=/home/rd/rd_ws/log/robot_disco-route-editor.err.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=1
; rclpy needs HOME / a log dir ("failed to initialize logging: Failed to get logging directory" under supervisor otherwise)
environment=HOME="/home/rd",USER="rd",ROS_LOG_DIR="/home/rd/.ros/log",FASTRTPS_DEFAULT_PROFILES_FILE="/home/rd/rd_ws/services/fastdds_no_shm.xml"
user=rd
