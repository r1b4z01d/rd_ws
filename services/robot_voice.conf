[program:robot_voice]
; Voice assistant: microphone → Whisper → Claude brain → speaks through robot_face.
; Secrets (ANTHROPIC_API_KEY, HASS_URL, HASS_TOKEN) live in /home/rd/.robot_face/voice.env, not here.
command=/usr/bin/env bash -lc "set -a; [ -f /home/rd/.robot_face/voice.env ] && . /home/rd/.robot_face/voice.env; set +a; source /home/rd/rd_ws/install/setup.bash && ROS_DOMAIN_ID=0 ros2 launch robot_voice voice_assistant.launch.py"
directory=/home/rd/rd_ws
autostart=true
autorestart=true
startsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/home/rd/rd_ws/log/robot_voice.out.log
stderr_logfile=/home/rd/rd_ws/log/robot_voice.err.log
stdout_logfile_maxbytes=20MB
stderr_logfile_maxbytes=20MB
stdout_logfile_backups=2
stderr_logfile_backups=2
; XDG_RUNTIME_DIR gives parecord/aplay the user's PulseAudio/PipeWire; same DDS profile as every other unit.
environment=HOME="/home/rd",USER="rd",XDG_RUNTIME_DIR="/run/user/1000",RMW_IMPLEMENTATION="rmw_cyclonedds_cpp",CYCLONEDDS_URI="file:///home/rd/rd_ws/services/cyclonedds.xml"
user=rd
