[program:robot_disco_foxglove_bridge]
; Not started at boot (2026-11-01): the route editor's /3d page (robot_disco_route_editor) replaced Foxglove
; for day-to-day use. Start it when you want Foxglove Studio:  sudo supervisorctl start robot_disco_foxglove_bridge
command=/usr/bin/env bash -lc "source /home/rd/rd_ws/install/setup.bash && ROS_DOMAIN_ID=0 ros2 launch robot_disco foxglove_bridge_launch.xml"
directory=/home/rd/rd_ws
autostart=false
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/home/rd/rd_ws/log/robot_disco-foxglove.out.log
stderr_logfile=/home/rd/rd_ws/log/robot_disco-foxglove.err.log
stdout_logfile_maxbytes=20MB
stderr_logfile_maxbytes=20MB
stdout_logfile_backups=2
stderr_logfile_backups=2
environment=HOME="/home/rd",RMW_IMPLEMENTATION="rmw_cyclonedds_cpp",CYCLONEDDS_URI="file:///home/rd/rd_ws/services/cyclonedds.xml"
user=rd
