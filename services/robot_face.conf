[program:robot_face]
command=/usr/bin/env bash -lc "source /home/rd/rd_ws/install/setup.bash && ROS_DOMAIN_ID=0 ros2 launch robot_face combined_face_hand.launch.py"
directory=/home/rd/rd_ws
autostart=true
autorestart=false
stopasgroup=true
killasgroup=true
stdout_logfile=/home/rd/rd_ws/log/robot_face-launch.out.log
stderr_logfile=/home/rd/rd_ws/log/robot_face-launch.err.log
stdout_logfile_maxbytes=20MB
stderr_logfile_maxbytes=20MB
stdout_logfile_backups=2
stderr_logfile_backups=2
# The face is a GL window on the robot's screen (GDM X11 session as rd) and speaks through the
# user's PulseAudio/PipeWire: without DISPLAY/XAUTHORITY glfw.init() fails, without XDG_RUNTIME_DIR
# there is no audio. Same display env as the VLA teleop unit.
environment=HOME="/home/rd",USER="rd",DISPLAY=":0",XAUTHORITY="/run/user/1000/gdm/Xauthority",XDG_RUNTIME_DIR="/run/user/1000",FASTRTPS_DEFAULT_PROFILES_FILE="/home/rd/rd_ws/services/fastdds_no_shm.xml"
user=rd