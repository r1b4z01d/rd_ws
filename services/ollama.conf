[program:ollama]
; Local language model on the robot itself: the FALLBACK brain for robot_voice when the GPU box is off
; (voice_assistant.yaml tries http://192.168.11.119:11434 first, then this one on loopback). Same shape as
; the GPU box's unit (provision/gpu/ollama.conf). Ollama's installer also drops a systemd unit,
; ollama.service, that would race this program for :11434 — provision.sh llm disables it; an Ollama
; upgrade through the installer re-enables it, so run `provision.sh llm` again afterwards.
;
; HOME must be set: supervisor keeps root's HOME across user=, and the model store is $HOME/.ollama/models.
; Loopback only: nothing but this robot's voice node talks to it. OLLAMA_KEEP_ALIVE is short because the
; Orin's 64 GB is shared with the VLA inference server and the cameras; the model (qwen2.5:7b, ~5 GB) is
; loaded on the first question and dropped again after 30 idle minutes.
command=/usr/local/bin/ollama serve
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=30
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/home/rd/rd_ws/log/ollama.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=2
environment=HOME="/usr/share/ollama",OLLAMA_HOST="127.0.0.1",OLLAMA_KEEP_ALIVE="30m",PATH="/usr/local/bin:/usr/bin:/bin"
user=ollama
